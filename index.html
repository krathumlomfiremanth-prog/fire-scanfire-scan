<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ระบบตรวจสอบถังดับเพลิง เทศบาลเมืองกระทุ่มล้ม</title>
    <!-- ดึงระบบคำสั่งของ LINE LIFF มาใช้งาน -->
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <p style="text-align: center; font-size: 18px; margin-top: 50px;">กำลังเปิดกล้องถ่ายรูปเพื่อสแกนถังดับเพลิง...</p>

    <script>
        // บังคับปลุกระบบกล้องหลักของโทรศัพท์ขึ้นมาทำงานทันที
        liff.init({ liffId: "2011967473-uNg8ywfT" }).then(() => {
            if (liff.isLoggedIn()) {
                liff.scanCodeV2().then(result => {
                    if (result.value) {
                        const qrResult = result.value; // รหัสถังดับเพลิงที่สแกนได้จากข้างถัง
                        
                        // ⚠️ ลบลิงก์ตัวอย่างด้านล่างออก แล้วเอาลิงก์ Google Forms ตัวเต็มของเทศบาลมาวางใส่แทนครับ
                        const googleFormUrl = "https://docs.google.com/forms/d/1JzZ334bqOCxjDs_npDMyK2RIXqpFBmGZRFA147MHTQU/edit";
                        
                        window.location.href = googleFormUrl;
                    }
                }).catch(err => { alert("กล้องไม่ทำงาน: " + err); });
            } else {
                liff.login();
            }
        });
    </script>
</body>
</html>
