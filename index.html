<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ระบบตรวจสอบถังดับเพลิง เทศบาลเมืองกระทุ่มล้ม</title>
    <!-- ดึงไฟล์คำสั่งพัฒนาระบบ LINE LIFF มาใช้งานเพื่อล็อกอินผู้ใช้งาน -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; text-align: center; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { padding: 30px; background: white; width: 85%; max-width: 400px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-radius; }
        .logo { font-size: 40px; margin-bottom: 10px; }
        .title { font-size: 20px; color: #d9534f; font-weight: bold; margin: 10px 0; }
        .desc { font-size: 14px; color: #555; line-height: 1.5; margin-bottom: 25px; }
        
        /* ปุ่มสแกนสีแดงเด่นชัด สั่งเปิดเลนส์กล้องมือถือตรงๆ */
        .scan-btn { display: inline-block; width: 100%; padding: 15px 0; background-color: #e53935; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 8px rgba(229,57,53,0.3); cursor: pointer; transition: 0.2s; }
        .scan-btn:active { transform: scale(0.98); background-color: #c62828; }
        
        /* สั่งซ่อนหน้าจอกล้องสแกนไฟล์ดั้งเดิมของระบบ */
        #qr-input { display: none; }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="logo">🚒</div>
        <div class="title">เทศบาลเมืองกระทุ่มล้ม</div>
        <div class="desc">ระบบตรวจสอบสถานะถังดับเพลิงประจำชุมชน<br>กรุณากดปุ่มด้านล่างเพื่อเปิดกล้องมือถือสแกนคิวอาร์โค้ดที่ข้างถังดับเพลิงค่ะ</div>
        
        <!-- ตัวรับคำสั่งเรียกเปิดกล้องถ่ายรูปสแกนรหัสของโทรศัพท์โดยตรง -->
        <input type="file" id="qr-input" accept="image/*" capture="environment">
        
        <!-- ปุ่มกดเปิดกล้องสวยงามสำหรับให้ประชาชนใช้นิ้วคลิก -->
        <button class="scan-btn" onclick="openCamera()">📷 กดตรงนี้ เพื่อเปิดกล้องสแกน</button>
    </div>

    <!-- ดึงระบบเครื่องมืออ่านรหัสคิวอาร์โค้ดความไวสูงมาช่วยประมวลผลเบื้องหลัง -->
    <script src="https://unpkg.com"></script>
    <script>
        // เริ่มต้นเปิดระบบ LIFF เพื่อตรวจสอบความปลอดภัยของแอป LINE
        liff.init({ liffId: "2011967473-uNg8ywfT" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login();
            }
        }).catch(err => { console.error("LIFF Error:", err); });

        // ฟังก์ชันสั่งดีดเปิดเลนส์กล้องถ่ายรูปแท้ของมือถือทันทีเมื่อประชาชนกดปุ่ม
        function openCamera() {
            document.getElementById('qr-input').click();
        }

        // เมื่อกล้องถ่ายภาพ QR Code ติดปุ๊บ ระบบประมวลผลอ่านลิงก์ Google Forms แยกถังทันที
        document.getElementById('qr-input').addEventListener('change', function(e) {
            if (e.target.files.length === 0) return;
            
            var file = e.target.files[0];
            var html5QrCode = new Html5Qrcode("qr-input");
            
            // สั่งแกะลายคิวอาร์โค้ดจากกล้องถ่ายรูป
            Html5Qrcode.scanImage(file, { experimental: { useBarCodeDetectorIfSupported: true } })
                .then(qrCodeMessage => {
                    // เมื่อแกะเจอลิงก์ Google Forms ตัวเต็มแยกถัง (`https://google.com`) ให้พุ่งเข้าเว็บฟอร์มทันที!
                    if (qrCodeMessage.startsWith("http://") || qrCodeMessage.startsWith("https://")) {
                        window.location.href = qrCodeMessage;
                    } else {
                        // กรณีในคิวอาร์เป็นรหัสข้อความสั้น โค้ดจะช่วยผูกเข้าฟอร์มเทศบาลให้อัตโนมัติ ป้องกันลิงก์หลุด
                        window.location.href = "https://google.com" + encodeURIComponent(qrCodeMessage);
                    }
                })
                .catch(err => {
                    // หากรูปภาพเบลอหรือมุมกล้องเบี้ยว ให้ประชาชนกดสแกนซ้ำได้สะดวก
                    alert("สแกนไม่สำเร็จ: กรุณาขยับกล้องให้ตรงและถ่ายภาพ QR Code ข้างถังดับเพลิงใหม่อีกครั้งค่ะ");
                });
        });
    </script>
</body>
</html>
