<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ระบบตรวจสอบถังดับเพลิง เทศบาลเมืองกระทุ่มล้ม</title>
    <!-- ดึงไฟล์คำสั่งพัฒนาระบบกล้อง LINE LIFF ตัวล่าสุด -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; text-align: center; padding-top: 50px; }
        .container { padding: 30px; background: white; margin: 0 auto; max-width: 85%; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn { display: none; margin-top: 20px; padding: 12px 25px; background-color: #28a745; color: white; border: none; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; text-decoration: none; }
    </style>
</head>
<body>
    
    <div class="container">
        <p id="status-text" style="font-size: 18px; color: #333; font-weight: bold; margin-bottom: 10px;">กำลังเรียกเปิดกล้องถ่ายรูป...</p>
        <p id="sub-text" style="font-size: 14px; color: #666;">กรุณารอสักครู่ ระบบกำลังปลุกกล้องถ่ายรูปเพื่อสแกน QR Code ข้างถังดับเพลิง</p>
        
        <!-- ปุ่มสำรองวิ่งเข้า Google Forms ปลายทางหน้าแรก -->
        <a id="backup-btn" class="btn" href="https://google.com">คลิกที่นี่ เพื่อเข้าฟอร์มตรวจสอบโดยตรง</a>
    </div>

    <script>
        // เริ่มต้นเปิดระบบ LIFF ID ของเทศบาลเมืองกระทุ่มล้ม
        liff.init({ liffId: "2011967473-uNg8ywfT" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                
                // ตั้งเวลาดักจับ (Timeout) 3 วินาที หากกล้องเปิดไม่สำเร็จ ให้แสดงปุ่มกดทันที
                setTimeout(function() {
                    document.getElementById("status-text").innerText = "ระบบกล้องขัดข้อง หรือไม่รองรับมือถือรุ่นนี้";
                    document.getElementById("sub-text").innerText = "สแกนไม่ติด? ไม่ต้องกังวล คุณสามารถกดปุ่มด้านล่างเพื่อเข้าฟอร์มไปพิมพ์รายงานเลขถังได้ทันทีค่ะ";
                    document.getElementById("backup-btn").style.display = "inline-block";
                }, 3000);

                // สั่งเปิดระบบเลนส์กล้องแท้ของสมาร์ทโฟน
                liff.scanCodeV2().then(result => {
                    if (result.value) {
                        var qrResult = result.value; // จะได้ลิงก์ตัวเต็มจาก QR Code เช่น https://google.com
                        
                        // 🛠️ ปรับแก้พิเศษ: สั่งให้เบราว์เซอร์วิ่งเข้าสู่ลิงก์ตรงจาก QR Code ชิ้นนั้นทันทีโดยไม่พ่วงโค้ดซ้ำซ้อน
                        window.location.href = qrResult;
                    }
                }).catch(err => {
                    document.getElementById("status-text").innerText = "แอป LINE ปฏิเสธการเข้าถึงกล้อง";
                    document.getElementById("backup-btn").style.display = "inline-block";
                });
            }
        }).catch(err => { 
            document.getElementById("status-text").innerText = "เชื่อมต่อระบบไม่สำเร็จ";
            document.getElementById("backup-btn").style.display = "inline-block";
        });
    </script>
</body>
</html>
