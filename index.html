<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ระบบตรวจสอบถังดับเพลิง เทศบาลเมืองกระทุ่มล้ม</title>
    <!-- ดึงไฟล์คำสั่งพัฒนาระบบกล้อง LINE LIFF เวอร์ชันเสถียรมาตรฐานสากล -->
    <script src="https://line-scdn.net"></script>
</head>
<body style="background-color: #f4f4f4; font-family: sans-serif; text-align: center; padding-top: 50px;">
    
    <div style="padding: 20px; background: white; margin: 0 auto; max-width: 80%; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <p style="font-size: 18px; color: #333; font-weight: bold; margin-bottom: 10px;">กำลังเรียกเปิดกล้องถ่ายรูป...</p>
        <p style="font-size: 14px; color: #666;">กรุณากดยอมรับสิทธิ์การเข้าถึงกล้องหากระบบร้องขอ เพื่อสแกนคิวอาร์โค้ดข้างถังดับเพลิง</p>
    </div>

    <script>
        // เริ่มต้นเปิดระบบ LIFF ID ของเทศบาลเมืองกระทุ่มล้ม
        liff.init({ liffId: "2011967473-uNg8ywfT" }).then(() => {
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                // บังคับปลุกเลนส์กล้องถ่ายรูปหลักของเครื่องขึ้นมาทำงานทันที
                liff.scanCodeV2().then(result => {
                    if (result.value) {
                        var qrResult = result.value; // ข้อความที่กล้องสแกนได้จาก QR Code ข้างถัง
                        
                        // 🚨 จุดแจ้งเตือน: บังคับให้มือถือโชว์ป๊อปอัปบอกทันทีว่ากล้องอ่านค่าได้คำว่าอะไร
                        alert("กล้องอ่านค่าได้คำว่า: " + qrResult);
                        
                        // นำค่ารหัสที่ได้มาเชื่อมพ่วงเข้ากับลิงก์ Google Forms ตัวเต็มของเทศบาลอย่างถูกต้อง
                        var googleFormUrl = "https://google.com" + encodeURIComponent(qrResult);
                        
                        // สั่งเปลี่ยนหน้าจอพาวิ่งเข้า Google Forms ทันที
                        window.location.href = googleFormUrl;
                    } else {
                        alert("ไม่พบข้อมูลภายใน QR Code หรือคุณได้กดปิดหน้าจอกล้องสแกน");
                    }
                }).catch(err => { 
                    alert("แอป LINE หรือระบบเครื่องปฏิเสธการเข้าถึงกล้อง ข้อผิดพลาด: " + err); 
                });
            }
        }).catch(err => { 
            alert("เชื่อมต่อกับ LINE Developers ไม่สำเร็จ กรุณาเช็กความถูกต้องของรหัส LIFF ID ข้อผิดพลาด: " + err); 
        });
    </script>
</body>
</html>
