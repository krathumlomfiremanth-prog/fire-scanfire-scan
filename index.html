<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>ระบบตรวจสอบถังดับเพลิง เทศบาลเมืองกระทุ่มล้ม</title>
    <!-- เรียกใช้งานโมดูลระบบความปลอดภัย LINE LIFF มาตรฐาน -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { background-color: #f4f4f4; font-family: sans-serif; text-align: center; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { padding: 30px; background: white; width: 85%; max-width: 400px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        .logo { font-size: 45px; margin-bottom: 5px; }
        .title { font-size: 20px; color: #d9534f; font-weight: bold; margin: 5px 0; }
        .desc { font-size: 15px; color: #333; line-height: 1.6; margin-bottom: 25px; font-weight: 500; }
        
        /* ปุ่มสแกนทางเลือกหลัก บังคับดีดสลับเปิดกล้องหลักของโทรศัพท์ทันที 100% */
        .scan-btn { display: inline-block; width: 100%; padding: 15px 0; background-color: #e53935; color: white; border: none; border-radius: 30px; font-size: 18px; font-weight: bold; text-decoration: none; box-shadow: 0 4px 8px rgba(229,57,53,0.3); margin-bottom: 15px; cursor: pointer; }
        
        /* ปุ่มสำรองกรอกแบบฟอร์มโดยตรงกรณีฉุกเฉิน */
        .backup-btn { display: inline-block; width: 100%; padding: 12px 0; background-color: #6c757d; color: white; border: none; border-radius: 30px; font-size: 15px; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="logo">🚒</div>
        <div class="title">เทศบาลเมืองกระทุ่มล้ม</div>
        <div class="desc">ระบบตรวจสอบสถานะถังดับเพลิงประจำชุมชน<br>กรุณากดปุ่มด้านล่างเพื่อเปิดใช้งานกล้องของโทรศัพท์สแกน QR Code ค่ะ</div>
        
        <!-- ปุ่มคำสั่งพิเศษสั่งยิงตรงปลุกกล้องถ่ายรูปของเครื่องโทรศัพท์ขึ้นมาสแกนลิงก์ทันที -->
        <a class="scan-btn" href="https://line.me">📷 เปิดกล้องสแกน QR ข้างถัง</a>
        
        <!-- ปุ่มเปิดหน้ารวมฟอร์มกรณีสติกเกอร์จางหรืออ่านค่าไม่ได้ -->
        <a class="backup-btn" href="https://google.com">ฟอร์มสำหรับพิมพ์เลขถังเอง</a>
    </div>

    <script>
        // เรียกเริ่มระบบ LIFF เพื่อคงสถานะความเสถียรภายใน LINE OA หลังบ้าน
        liff.init({ liffId: "2011967473-uNg8ywfT" }).then(() => {
            if (!liff.isLoggedIn()) { liff.login(); }
        }).catch(err => { console.error(err); });
    </script>
</body>
</html>
